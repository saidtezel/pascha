<svg viewBox="0 0 1200 380" width="1200" height="380" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="typestate asset lifecycle: Discovered transitions to Downloaded via Download(ctx, hc); Downloaded to Prepared via Prepare(software), which reinjects EXIF into the temp file; Prepared to Uploaded via Upload(ctx, *sink.Immich). Uploaded is terminal: Immich holding the asset is the record.">
  <defs>
    <marker id="t-arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#4a6741"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif">
  <text x="20" y="32" font-size="22" font-weight="700" fill="#4a6741">typestate asset lifecycle</text>
  <text x="20" y="54" font-size="12" fill="#404040">each phase is a distinct Go type. The only path between phases is the transition method on the source phase. Skipping a phase is a compile error.</text>

  <text x="600" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#909090">PHASES (left to right; Uploaded is terminal)</text>

  <rect x="40" y="120" width="220" height="80" rx="4" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="150" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">Discovered</text>
  <text x="150" y="160" text-anchor="middle" font-size="9" fill="#404040">famlyImageID, source,</text>
  <text x="150" y="174" text-anchor="middle" font-size="9" fill="#404040">signed url, filename hint,</text>
  <text x="150" y="188" text-anchor="middle" font-size="9" fill="#404040">timestamps, body, sender</text>

  <line x1="260" y1="160" x2="340" y2="160" stroke="#4a6741" stroke-width="1.5" marker-end="url(#t-arrow)"/>
  <text x="300" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#4a6741">Download</text>
  <text x="300" y="178" text-anchor="middle" font-size="8" fill="#909090">(ctx, hc)</text>

  <rect x="340" y="120" width="220" height="80" rx="4" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="450" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">Downloaded</text>
  <text x="450" y="160" text-anchor="middle" font-size="9" fill="#404040">temp file path,</text>
  <text x="450" y="174" text-anchor="middle" font-size="9" fill="#404040">SHA1, size,</text>
  <text x="450" y="188" text-anchor="middle" font-size="9" fill="#404040">Content-Type</text>

  <line x1="560" y1="160" x2="640" y2="160" stroke="#4a6741" stroke-width="1.5" marker-end="url(#t-arrow)"/>
  <text x="600" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#4a6741">Prepare</text>
  <text x="600" y="178" text-anchor="middle" font-size="8" fill="#909090">(software)</text>

  <rect x="640" y="120" width="220" height="80" rx="4" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="750" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">Prepared</text>
  <text x="750" y="160" text-anchor="middle" font-size="9" fill="#404040">EXIF + XMP in temp file,</text>
  <text x="750" y="174" text-anchor="middle" font-size="9" fill="#404040">video sidecar, final</text>
  <text x="750" y="188" text-anchor="middle" font-size="9" fill="#404040">filename extension</text>

  <line x1="860" y1="160" x2="940" y2="160" stroke="#4a6741" stroke-width="1.5" marker-end="url(#t-arrow)"/>
  <text x="900" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#4a6741">Upload</text>
  <text x="900" y="178" text-anchor="middle" font-size="8" fill="#909090">(ctx, sink)</text>

  <rect x="940" y="120" width="220" height="80" rx="4" fill="#f4f7f3" stroke="#4a6741" stroke-width="2"/>
  <text x="1050" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">Uploaded</text>
  <text x="1050" y="160" text-anchor="middle" font-size="9" fill="#404040">immich asset id,</text>
  <text x="1050" y="174" text-anchor="middle" font-size="9" fill="#404040">created or duplicate;</text>
  <text x="1050" y="188" text-anchor="middle" font-size="9" fill="#404040">terminal: Immich is the record</text>

  <text x="600" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#909090">COMPILE-TIME ENFORCEMENT</text>

  <rect x="40" y="260" width="540" height="90" rx="3" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="280" font-size="11" font-weight="600" fill="#0a0a0a">what the type system refuses</text>
  <text x="50" y="300" font-size="10" fill="#404040">disc.Upload(...)       // no method on Discovered</text>
  <text x="50" y="316" font-size="10" fill="#404040">dl.Upload(...)         // no method on Downloaded; Prepare first</text>
  <text x="50" y="332" font-size="10" fill="#404040">prep.Download(...)     // no going back a phase</text>

  <rect x="620" y="260" width="540" height="90" rx="3" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="630" y="280" font-size="11" font-weight="600" fill="#0a0a0a">what's allowed (the only path)</text>
  <text x="630" y="300" font-size="10" fill="#404040">disc.Download(...).Prepare(...).Upload(...)</text>
  <text x="630" y="316" font-size="10" fill="#909090">no local record: before Discovered, sync asks Immich whether it has the id.</text>
  </g>
</svg>
