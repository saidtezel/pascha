# Builds the pascha container image for linux/amd64 and linux/arm64
# and pushes it to ghcr.io/saidtezel/pascha.
#
#   push to main -> :main, :sha-<short>
#   tag vX.Y.Z   -> :X.Y.Z, :X.Y, :latest
#   pull request -> build only, nothing pushed
#
# Run it by hand from the Actions tab (workflow_dispatch) to rebuild
# the current branch. The package is private unless its visibility is
# changed in the package settings; pull it with a classic PAT that has
# the read:packages scope:
#
#   echo $TOKEN | docker login ghcr.io -u <github-user> --password-stdin
#   docker pull ghcr.io/saidtezel/pascha:latest
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
